# Extraction settings (docs/spec/08_extraction.md). The API key comes only from ANTHROPIC_API_KEY.
model: claude-haiku-5-5   # development model; the production model is chosen after the gold-set evaluation
effort: medium
max_tokens: 16000
confidence_threshold: 0.7   # 08 §10 row 6, until the gold set sets it
max_usd: 5.0                # stop a run when the recorded total reaches this
api_key_expires: 2026-12-06
api_key_warn_days: 14
# USD per million tokens, checked against the pricing page on 2026-11-06. Haiku: prompts up to 100,000 tokens.
prices:
  claude-haiku-5-5: {input: 0.10, cache_write: 0.125, cache_read: 0.01, output: 0.50}
  claude-sonnet-5-5: {input: 2.00, cache_write: 2.50, cache_read: 0.10, output: 10.00}
  claude-opus-5-5: {input: 4.00, cache_write: 5.00, cache_read: 0.20, output: 20.00}
